<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מערכת ניהול אירועים - טורו</title>
<style>
:root{
  --bg:#F7F2E8;--card:#FFFFFF;--gold:#C79A45;--gold-dark:#A87D30;--gold-light:#F3E6C7;
  --text-dark:#2E2B24;--text-muted:#8A8578;--border:#E7DCC0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Assistant',Arial,sans-serif;background:var(--bg);direction:rtl;}
.app-shell{display:flex;height:100vh;position:relative;}
.app-nav{
  width:230px;flex-shrink:0;background:var(--card);border-left:1px solid var(--border);
  display:flex;flex-direction:column;padding:24px 0;
  transition:width .2s ease, padding .2s ease;overflow:hidden;
}
.app-nav.collapsed{width:0;padding:0;border-left:none;}
.app-nav.collapsed .nav-logo, .app-nav.collapsed .nav-links, .app-nav.collapsed .nav-footer{opacity:0;pointer-events:none;}
.nav-toggle{
  position:fixed;top:26px;right:222px;z-index:60;
  width:30px;height:30px;border-radius:50%;background:#fff;
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);transition:right .2s ease;box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.nav-toggle:hover{border-color:var(--gold);color:var(--gold-dark);}
.nav-toggle.collapsed{right:8px;}
.nav-toggle svg{width:15px;height:15px;transition:transform .2s ease;}
.nav-toggle.collapsed svg{transform:rotate(180deg);}
.nav-logo{text-align:center;padding:0 20px 22px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.nav-logo img{height:52px;}
.nav-links{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 12px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;
  color:var(--text-dark);text-decoration:none;font-size:14px;font-weight:600;
  cursor:pointer;transition:.15s;border:none;background:none;width:100%;text-align:right;font-family:inherit;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;color:var(--text-muted);transition:.15s;}
.nav-item:hover{background:var(--gold-light);}
.nav-item.active{background:var(--gold);color:#fff;}
.nav-item.active svg{color:#fff;}
.nav-footer{padding:16px 16px 0;border-top:1px solid var(--border);margin-top:12px;}
.nav-user{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.nav-user .avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-light);color:var(--gold-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.nav-user .name{font-size:13px;font-weight:700;}
.nav-user .role{font-size:11px;color:var(--text-muted);}
.nav-logout{display:flex;align-items:center;gap:8px;color:var(--gold-dark);font-weight:600;font-size:13px;cursor:pointer;padding:0 2px;text-decoration:none;background:none;border:none;font-family:inherit;}
.app-main{flex:1;min-width:0;position:relative;}
#screenFrame{width:100%;height:100%;border:none;display:block;}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;background:var(--bg);}
</style>
</head>

// UTF-8 safe base64 decode (plain atob() corrupts non-Latin1 text like Hebrew)
function decodeUtf8Base64(b64){
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

let currentScreen = null;

function showFrame(key){
  if(currentScreen === key) return;
  currentScreen = key;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navBtn = document.getElementById('nav-'+key);
  if(navBtn) navBtn.classList.add('active');

  const frame = document.getElementById('screenFrame');
  const loading = document.getElementById('loadingMsg');
  frame.style.display = 'none';
  loading.style.display = 'flex';

  const html = decodeUtf8Base64(SCREENS_B64[key]);
  frame.srcdoc = html;
  frame.onload = function(){
    loading.style.display = 'none';
    frame.style.display = 'block';
  };
}

function toggleNav(){
  document.getElementById('appNav').classList.toggle('collapsed');
  document.getElementById('navToggle').classList.toggle('collapsed');
}

showFrame('calendar');
</script>
